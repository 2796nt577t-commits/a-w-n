<style>

.panel h3{margin:0 0 12px;font-size:12px;font-weight:400;letter-spacing:.2em;color:#e5d8bc}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:11px inherit;color:var(--ink);background:#ffffff0a;border:1px solid #ffffff28;padding:8px 5px;cursor:pointer;transition:.2s}
button:hover,button.active{background:#d8c49b25;border-color:#d8c49b;color:#f4dfb7}
.timehead{display:flex;justify-content:space-between;margin:14px 0 6px;font:10px sans-serif;letter-spacing:.12em;color:var(--muted)}
input[type=range]{width:100%;accent-color:#d7c49c}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.actions button{min-height:34px}
.note{font:10px/1.7 sans-serif;color:#aeb9bd;margin-top:10px}
.bottom{position:fixed;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 13px;background:#111b24a8;border:1px solid #ffffff20;color:#c4cdd0;font:10px/1.5 sans-serif;letter-spacing:.12em;white-space:nowrap;backdrop-filter:blur(8px);pointer-events:none}
#toast{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;background:#15232bdc;border:1px solid #e4d5b255;color:#f1e4c8;font-size:12px;letter-spacing:.1em;opacity:0;transition:opacity .25s;pointer-events:none}
#bathExit{display:none;position:fixed;z-index:6;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 22px;background:#17252be8;border:1px solid #e8d7b8;color:#f3e6ce}
@media(max-width:620px){.panel{top:auto;bottom:65px;right:10px;width:205px;padding:11px}.panel h3{margin-bottom:8px}.timehead{margin:8px 0 4px}.actions{margin-top:8px}.note{display:none}.hud{top:12px}.bottom{bottom:12px;left:12px;transform:none;font-size:9px}}
</style>
</head>
<body>
<div id="scene"></div>
<div class="hud"><div class="kicker">KYOTO · PRIVATE ONSEN</div><div class="title">雪见私汤</div><div class="sub">雪庭深处，一室暖光</div></div>
<section class="panel">
  <h3>时 · 雪庭光景</h3>
  <div class="times">
    <button data-time="7" class="active">朝雪 07:00</button>
    <button data-time="18">暮色 18:00</button>
    <button data-time="22">雪夜 22:00</button>
  </div>
  <div class="timehead"><span>光线时刻</span><span id="timeLabel">07:00</span></div>
  <input id="timeRange" type="range" min="0" max="23" step="1" value="7">
  <div class="actions">
    <button id="branchBtn">轻触枝梢 · 落雪</button>
    <button id="footBtn">雪地 · 留下足迹</button>
    <button id="bathBtn">进入 · 泡汤视角</button>
    <button id="fireBtn">暖炉 · 添一根柴</button>
  </div>
  <div class="note">拖动旋转 · 滚轮缩放 · 右键平移<br>轻点雪树、雪地或温泉，也可触发场景互动。</div>
</section>
<div class="bottom">雪落无声　·　DRAG TO ORBIT / SCROLL TO ZOOM</div>
<button id="bathExit">返回庭院视角</button>
<div id="toast"></div>

renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0)return;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects([...treeGroup.children,...bath.children,ground],true);if(!hits.length)return;const obj=hits[0].object;if(hits[0].point.y>.9&&hits[0].point.z<-.4){dropSnow()}else if(hits[0].point.z>0&&hits[0].point.z<4.5){enterBath()}else{addFoot(hits[0].point.x,hits[0].point.z);say('雪面留下了轻轻的印记')}});
setTime(7);
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();const pos=flakes.geometry.attributes.position;for(let i=0;i<count;i++){pos.array[i*3+1]-=vel[i];pos.array[i*3]+=.003*Math.sin(t+i);if(pos.array[i*3+1]<0){pos.array[i*3+1]=13;pos.array[i*3+2]=(Math.random()-.5)*22}}pos.needsUpdate=true;ripples.forEach((r,i)=>{const s=1+Math.sin(t*1.3+i)*.08;r.scale.set(s,s,1);r.material.opacity=.18+Math.sin(t*1.3+i)*.08});falling.forEach((p,i)=>{p.position.y-=.025;p.position.x+=.004;if(p.position.y<.4){world.remove(p);falling.splice(i,1)}});fireFlames.forEach(f=>{f.scale.y=1.5+Math.sin(t*9)*.35});controls.update();renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
